services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: romhackdat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      # Postgres 18+ changed where it expects its data: the official image's
      # own volume mount point moved from /var/lib/postgresql/data to
      # /var/lib/postgresql (it manages a version-specific subfolder itself
      # underneath that, e.g. 18/docker) — mounting at the old /data path
      # makes the container refuse to start on 18+.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Gives a fresh container time to initialize its data directory on
      # first boot before failed checks start counting toward "unhealthy" —
      # without this, a slower first boot can get marked unhealthy before
      # Postgres has even finished starting up.
      start_period: 30s
    # Not published to the host by default — the app reaches it via the
    # internal "db" service name. Uncomment if you need direct host access
    # (e.g. to point a GUI client at it):
    # ports:
    #   - "5432:5432"

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      # Uploaded patch files (POST /api/submissions/[id]/patch) — a BIND
      # MOUNT (a real folder on this host), not a Docker-managed named
      # volume, by request: this puts the files at a path you choose
      # directly on disk, browsable/editable with nothing more than a
      # normal file manager or `ls` — no `docker exec`, no `docker volume
      # inspect`. Defaults to ./patch-storage (relative to wherever this
      # compose file lives) if PATCH_STORAGE_HOST_DIR isn't set — set that
      # in your .env to point somewhere else, e.g.
      # /examplefolder/Patches. Files are named
      # {sha1}__{hack name and version, sanitized}.{format} — e.g.
      # 3a7f9c1b...e2__Super-Mario-World-Kaizo-Edition-v2-0.bps — so the
      # folder is readable at a glance; the hash prefix is what the app
      # actually uses to find the file again, the rest is cosmetic. See
      # src/lib/patchStorage.ts (buildPatchDisplaySlug).
      #
      # IMPORTANT — bind mounts don't inherit the image's ownership the way
      # a named volume would: whatever host directory this points at needs
      # to be writable by uid 1001 (the container's non-root nextjs user)
      # BEFORE the app starts, or every upload will fail with a permission
      # error. On the host: `mkdir -p <the dir>` then either
      # `sudo chown 1001:1001 <the dir>` (cleanest) or `chmod 777 <the dir>`
      # (simpler, fine for a single-user personal server).
      - ${PATCH_STORAGE_HOST_DIR:-./patch-storage}:/app/data/patches
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/romhackdat
      PATCH_STORAGE_DIR: /app/data/patches
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      # Same reasoning as the LAN-access setup outside Docker: without this,
      # sign-in breaks for anyone reaching the app via anything other than
      # exactly NEXTAUTH_URL.
      AUTH_TRUST_HOST: "true"
      GITHUB_ID: ${GITHUB_ID:?Set GITHUB_ID in .env}
      GITHUB_SECRET: ${GITHUB_SECRET:?Set GITHUB_SECRET in .env}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      HASHEOUS_API_KEY: ${HASHEOUS_API_KEY:-}
      HASHEOUS_ENV: ${HASHEOUS_ENV:-beta}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}

volumes:
  db-data:
